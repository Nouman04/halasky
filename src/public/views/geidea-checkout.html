<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geidea Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.merchant.geidea.net/hpp/geideaCheckout.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.4);
            color: #fff;
        }

        /* ─── Header ─────────────────────────────── */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99,102,241,0.25);
            border: 1px solid rgba(99,102,241,0.5);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #a5b4fc;
            margin-bottom: 1rem;
        }
        .header .badge::before {
            content: '';
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(1.4); }
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        /* ─── Amount strip ───────────────────────── */
        .amount-strip {
            background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(168,85,247,0.3));
            border: 1px solid rgba(99,102,241,0.4);
            border-radius: 14px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
        }
        .amount-strip .label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.55);
            font-weight: 500;
        }
        .amount-strip .value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .amount-strip .currency {
            font-size: 0.9rem;
            color: #a5b4fc;
            font-weight: 600;
        }

        /* ─── Session ID box ─────────────────────── */
        .session-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .session-box .session-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
        }
        .session-box .session-value {
            font-size: 0.8rem;
            color: #4ade80;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            line-height: 1.5;
        }
        .session-box .session-value.loading {
            color: rgba(255,255,255,0.35);
            animation: shimmer 1.2s infinite;
        }
        .session-box .session-value.error-text {
            color: #f87171;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.35; }
            50%       { opacity: 1; }
        }

        /* ─── Form fields ─────────────────────────── */
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: rgba(255,255,255,0.25); }
        input:focus {
            border-color: rgba(99,102,241,0.7);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* ─── Pay button ─────────────────────────── */
        #pay-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        #pay-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99,102,241,0.55);
        }
        #pay-btn:active:not(:disabled) { transform: translateY(0); }
        #pay-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Result card ────────────────────────────── */
        #result-card {
            display: none;
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 1.2rem 1.4rem;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.82rem;
            line-height: 1.8;
        }
        #result-card.success { border-color: rgba(74,222,128,0.35); }
        #result-card.error   { border-color: rgba(248,113,113,0.35); }
        #result-card .result-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.6rem;
        }
        #result-card.success .result-title { color: #4ade80; }
        #result-card.error   .result-title { color: #f87171; }
        #result-card .result-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            color: rgba(255,255,255,0.65);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 4px 0;
        }
        #result-card .result-row:last-child { border-bottom: none; }
        #result-card .result-row span:first-child {
            color: rgba(255,255,255,0.4);
            flex-shrink: 0;
        }
        #result-card .result-row span:last-child {
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            text-align: right;
            word-break: break-all;
        }

        /* ─── Status message ─────────────────────── */
        #status-msg {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.2rem;
            color: rgba(255,255,255,0.6);
            transition: color 0.2s;
        }
        #status-msg.success { color: #4ade80; }
        #status-msg.error   { color: #f87171; }

        /* ─── Security footer ─────────────────────── */
        .security-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.3);
            font-size: 0.72rem;
        }
        .security-footer svg { width: 13px; height: 13px; fill: currentColor; }

        /* ─── Divider ─────────────────────────────── */
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
<div class="card">

    <!-- Header -->
    <div class="header">
        <div class="badge">Secure Payment</div>
        <h1>Geidea Checkout</h1>
        <p>Complete your purchase safely &amp; securely</p>
    </div>

    <!-- Fixed Amount -->
    <div class="amount-strip">
        <div>
            <div class="label">Total Amount</div>
            <div style="color:rgba(255,255,255,0.35);font-size:0.78rem;margin-top:2px;">Fixed · Non-adjustable</div>
        </div>
        <div style="text-align:right">
            <div class="value">100.<span style="font-size:1.1rem">00</span></div>
            <div class="currency">SAR</div>
        </div>
    </div>

    <!-- Session ID Display -->
    <div class="session-box">
        <span class="session-label">Session ID</span>
        <span class="session-value loading" id="session-id-display">Initializing session…</span>
    </div>

    <hr class="divider">

    <!-- Card Details Form -->
    <div class="form-group">
        <label for="card-number">Card Number</label>
        <input
            type="text"
            id="card-number"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            autocomplete="cc-number"
            inputmode="numeric"
        >
    </div>

    <div class="row-2">
        <div class="form-group">
            <label for="expiry">Expiry Date</label>
            <input
                type="text"
                id="expiry"
                placeholder="MM / YY"
                maxlength="7"
                autocomplete="cc-exp"
                inputmode="numeric"
            >
        </div>
        <div class="form-group">
            <label for="cvc">CVC / CVV</label>
            <input
                type="text"
                id="cvc"
                placeholder="123"
                maxlength="4"
                autocomplete="cc-csc"
                inputmode="numeric"
            >
        </div>
    </div>

    <!-- Pay Button -->
    <button id="pay-btn" disabled>Pay SAR 100.00</button>

    <!-- Status -->
    <div id="status-msg"></div>

    <!-- Payment Result Card -->
    <div id="result-card"></div>

    <div id="iframe-container"></div>

    <!-- Security note -->
    <div class="security-footer">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.71-2.56 7.18-6 8.19C8.56 18.18 6 14.71 6 11V7.67L12 5z"/></svg>
        Secured by Geidea · 256-bit TLS Encryption
    </div>

</div>

<script>
    // ─── State ────────────────────────────────────────────
    let currentSessionId = null;

    // ─── Utility: format card number with spaces ──────────
    document.getElementById('card-number').addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').substring(0, 16);
        this.value = v.replace(/(.{4})/g, '$1 ').trim();
    });

    // ─── Utility: format expiry MM / YY ──────────────────
    document.getElementById('expiry').addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').substring(0, 4);
        if (v.length >= 3) v = v.substring(0, 2) + ' / ' + v.substring(2);
        this.value = v;
    });

    // ─── Utility: CVC digits only ─────────────────────────
    document.getElementById('cvc').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').substring(0, 4);
    });

    // ─── Set session display ──────────────────────────────
    function setSessionDisplay(text, state) {
        const el = document.getElementById('session-id-display');
        el.className = 'session-value';
        if (state === 'loading') el.classList.add('loading');
        if (state === 'error')   el.classList.add('error-text');
        el.textContent = text;
    }

    function setStatus(msg, type) {
        const el = document.getElementById('status-msg');
        el.textContent = msg;
        el.className = type || '';
    }

    // ─── Create session on page load ──────────────────────
    async function initSession() {
        setSessionDisplay('Initializing session…', 'loading');
        document.getElementById('pay-btn').disabled = true;

        try {
            const res  = await fetch('/test/geidea/get-session');
            const data = await res.json();

            if (data.status && data.sessionId) {
                currentSessionId = data.sessionId;
                console.log('[Geidea] Session ID:', currentSessionId);

                setSessionDisplay(currentSessionId, 'ready');
                document.getElementById('pay-btn').disabled = false;
                setStatus('Session ready. Enter your card details to pay.', '');
            } else {
                throw new Error(data.message || 'Session creation failed');
            }
        } catch (err) {
            console.error('[Geidea] Session init error:', err);
            setSessionDisplay('Failed to create session — ' + err.message, 'error');
            setStatus('Could not initialise payment session. Please refresh.', 'error');
        }
    }

    // ─── Result card helper ───────────────────────────────
    function showResult(type, rows) {
        const card = document.getElementById('result-card');
        card.className = type; // 'success' | 'error'
        card.style.display = 'block';

        const title = type === 'success' ? '✅ Payment Successful' : '❌ Payment Failed';
        card.innerHTML = `<div class="result-title">${title}</div>` +
            rows.map(([k, v]) =>
                `<div class="result-row"><span>${k}</span><span>${v ?? '—'}</span></div>`
            ).join('');

        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function setPayBtn(processing) {
        const btn = document.getElementById('pay-btn');
        if (processing) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Processing…';
        } else {
            btn.disabled = false;
            btn.innerHTML = 'Pay SAR 100.00';
        }
    }

 document.getElementById('pay-btn').addEventListener('click', async () => {
    if (!currentSessionId) {
        setStatus('Session not ready. Please wait…', 'error');
        return;
    }

    const rawCard   = document.getElementById('card-number').value.replace(/\s/g, '');
    const expiryVal = document.getElementById('expiry').value.replace(/\s/g, '');
    const rawCvc    = document.getElementById('cvc').value.trim();

    if (rawCard.length < 13) { setStatus('Please enter a valid card number.', 'error'); return; }
    const expiryDigits = expiryVal.replace('/', '');
    if (expiryDigits.length < 4) { setStatus('Please enter a valid expiry date (MM/YY).', 'error'); return; }
    if (rawCvc.length < 3) { setStatus('Please enter a valid CVC.', 'error'); return; }

    const expiryMonth = expiryDigits.substring(0, 2);
    const expiryYear  = '20' + expiryDigits.substring(2, 4);

    // ✅ Store card data globally so processPay() can access it
    window._paymentData = { rawCard, rawCvc, expiryMonth, expiryYear };

    setPayBtn(true);
    setStatus('Starting 3DS authentication…', '');

    try {
        // ── STEP 1: Initiate Authentication ──────────────────────────────
        const initiateRes = await fetch('/test/geidea/initiate/authentication', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sessionId:  currentSessionId,
                cardNumber: rawCard,
                expiryMonth,
                expiryYear,
                cvv:        rawCvc
            }),
        });

        const initiateData = await initiateRes.json();
        console.log('[Geidea] Initiate response:', initiateData);

        if (initiateData.responseCode !== '000') {
            showResult('error', [['Reason', initiateData.responseMessage || 'Initiate failed']]);
            setPayBtn(false);
            return;
        }

        // ── STEP 2: Silent 3DS method iframe ──────────────────────────────
        if (initiateData.redirectHtml) {
            setStatus('Running 3DS device check…', '');
            await run3dsMethodFrame(initiateData.redirectHtml);
        }

        // ── STEP 3: Authenticate Payer ────────────────────────────────────
        setStatus('Authenticating payer…', '');

        const authRes = await fetch('/test/geidea/authenticate/payer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sessionId:      currentSessionId,
                orderId:        initiateData.orderId,
                threeDSecureId: initiateData.threeDSecureId,
                cardNumber:     rawCard,
                expiryMonth,
                expiryYear,
                cvv:            rawCvc,
                cardholderName: 'Ahmed'
            }),
        });

        const authData = await authRes.json();
        console.log('[Geidea] Authenticate Payer response:', authData);

        // ── STEP 4: Handle Authenticate Payer result ──────────────────────
        if (authData.gatewayDecision === 'ContinueToPay') {
            console.log(11111);
            // No OTP needed — go straight to Pay
            setStatus('Proceeding to payment…', '');
            try {
                console.log('calling processPay');
                await processPay(authData.orderId, authData.threeDSecureId);
                console.log('processPay finished');
            } catch (e) {
                console.error('processPay failed:', e);
            }

        }  else {
            showResult('error', [['Reason', authData.responseMessage || '3DS rejected']]);
            setPayBtn(false);
        }

    } catch (err) {
        console.error('[Geidea] Error:', err);
        setStatus('Network error: ' + err.message, 'error');
        setPayBtn(false);
    }
});


// ── Final Pay step ────────────────────────────────────────────────────────────
async function processPay(orderId, threeDSecureId) {
    // ✅ Card data stored earlier in window._paymentData
    console.log('inside processPay, paymentData:');
    const { rawCard, rawCvc, expiryMonth, expiryYear } = window._paymentData;

    try {
        setStatus('Processing payment…', '');
        const payRes = await fetch('/test/geidea/direct/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sessionId:      currentSessionId,
                orderId,
                threeDSecureId,
                cardNumber:     rawCard,
                expiryMonth,
                expiryYear,
                cvv:            rawCvc,
                cardholderName: 'Ahmed'
            }),
        });

        const payData = await payRes.json();
        console.log('[Geidea] Pay response:', payData);

        if (payData.responseCode === '000') {
            showResult('success', [
                ['Order ID',  payData.orderId  || orderId],
                ['Status',    'Payment Successful'],
                ['Amount',    payData.amount   || ''],
                ['Currency',  payData.currency || ''],
            ]);
        } else {
            showResult('error', [
                ['Reason', payData.responseMessage         || 'Payment failed'],
                ['Code',   payData.responseCode            || ''],
                ['Detail', payData.detailedResponseMessage || ''],
            ]);
            setPayBtn(false);
        }

    } catch (err) {
        console.error('[Geidea] Pay error:', err);
        setStatus('Payment error: ' + err.message, 'error');
        setPayBtn(false);
    }
}

// ── OTP Challenge: show in a modal overlay ────────────────────────────────────
function showOtpChallenge(html, orderId, threeDSecureId) {
    return new Promise((resolve) => {

        // Create a full-screen modal
        const modal = document.createElement('div');
        modal.style.cssText = `
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        `;

        const box = document.createElement('div');
        box.style.cssText = `
            background: white; border-radius: 12px;
            width: 420px; height: 520px; overflow: hidden; position: relative;
        `;

        // Render OTP HTML inside an iframe (sandboxed)
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'width:100%; height:100%; border:none;';
        iframe.srcdoc = html;  // ← render the OTP page inside iframe safely

        box.appendChild(iframe);
        modal.appendChild(box);
        document.body.appendChild(modal);

        // Poll your backend for OTP completion
        // Geidea posts back to your callback URL — your backend should expose
        // a status endpoint like GET /test/geidea/otp-status?orderId=xxx
        const poll = setInterval(async () => {
            try {
                const statusRes = await fetch(`/test/geidea/otp-status?orderId=${orderId}`);
                const statusData = await statusRes.json();

                if (statusData.completed) {
                    clearInterval(poll);
                    document.body.removeChild(modal);
                    resolve(statusData);
                }
            } catch (e) {
                // keep polling
            }
        }, 2000); // check every 2 seconds
    });
}

// Runs the silent 3DS method frame using a Blob URL
function run3dsMethodFrame(html) {
    return new Promise((resolve) => {

        // 1. Turn the HTML string into a real page via Blob
        const blob = new Blob([html], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        // 2. Create a hidden iframe pointing to the blob
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; border:none;';
        iframe.src = blobUrl;

        // 3. Resolve after 10 seconds (3DS method has no callback)
        iframe.onload = () => {
            console.log('[3DS] Method frame loaded');
            setTimeout(() => {
                URL.revokeObjectURL(blobUrl); // cleanup
                document.body.removeChild(iframe);
                resolve();
            }, 10000); // wait 10s for ACS to complete
        };

        iframe.onerror = () => {
            console.warn('[3DS] Method frame error, continuing anyway');
            URL.revokeObjectURL(blobUrl);
            document.body.removeChild(iframe);
            resolve(); // always continue even on error
        };

        document.body.appendChild(iframe);
    });
}

    // ─── Kick off on DOM ready ────────────────────────────
    document.addEventListener('DOMContentLoaded', initSession);
</script>
