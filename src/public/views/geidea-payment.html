<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geidea Payment Test</title>
    <script src="https://www.geidea.net/widgets/v1/geidea.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            width: 400px;
        }
        h1 { margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: none;
            outline: none;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 1rem;
            border-radius: 0.5rem;
            border: none;
            background: #ff4b2b;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover {
            background: #ff416c;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #message {
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Geidea Payment</h1>
        <input type="number" id="amount" placeholder="Amount (e.g. 100)" value="100">
        <input type="text" id="currency" placeholder="Currency (e.g. SAR)" value="SAR">
        <button id="pay-btn">Pay Now</button>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('pay-btn').addEventListener('click', async () => {
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerText = 'Creating session...';
            
            try {
                const response = await fetch('/test/geidea/create-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, currency })
                });
                
                const data = await response.json();
                
                if (data.status) {
                    messageDiv.innerText = 'Session created. Opening widget...';
                    
                    const onSuccess = (data) => {
                        console.log('Payment Success:', data);
                        alert('Payment Successful! SessionId: ' + data.sessionId);
                        messageDiv.innerText = 'Payment Successful!';
                    };
                    
                    const onError = (error) => {
                        console.error('Payment Error:', error);
                        alert('Payment Failed: ' + error.responseMessage);
                        messageDiv.innerText = 'Payment Failed.';
                    };
                    
                    const onCancel = () => {
                        console.log('Payment Cancelled');
                        messageDiv.innerText = 'Payment Cancelled.';
                    };

                    const geidea = new GeideaCheckout(onSuccess, onError, onCancel);
                    geidea.startPayment(data.sessionId);
                    
                } else {
                    messageDiv.innerText = 'Error: ' + data.message;
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerText = 'Request failed.';
            }
        });
    </script>
</body>
</html>
